name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "alembic/**"
      - "app/**"
      - "frontend/**"
      - "scripts/**"
      - "evaluation/tests/**"
      - "tests/**"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "worker.py"
      - "run.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "alembic/**"
      - "app/**"
      - "frontend/**"
      - "scripts/**"
      - "evaluation/tests/**"
      - "tests/**"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "worker.py"
      - "run.py"

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          enable-cache: true

      - name: Check uv lock file
        run: uv lock --check

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite://
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          DEEPSEEK_API_KEY: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --frozen --group dev python -m pytest

      - name: Run evaluation script tests
        run: uv run --frozen --group dev --group evaluation python -m pytest evaluation/tests

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate development compose file
        run: docker compose -f docker-compose.yml config

      - name: Validate production compose file
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          REFRESH_SECRET_KEY: ci-refresh-key-with-at-least-32-characters
          CORS_ORIGINS: http://localhost
          DEEPSEEK_API_KEY: ci-placeholder
          MODEL_ROOT: /tmp/models
        run: docker compose -f docker-compose.prod.yml config
